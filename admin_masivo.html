<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío Masivo - Banco Caja Social</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
        }

        .file-label {
            display: block;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-label:hover {
            background: #efefff;
        }

        .numbers-list {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .number-item {
            padding: 8px;
            background: white;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }

        .progress {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 12px;
            opacity: 0.9;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Envío Masivo</h1>
            <p>Banco Caja Social - Gestor de Mensajes</p>
        </div>

        <div class="content">
            <div class="alert alert-info" id="alertInfo">
                ℹ️ Recuerda: Respeta los límites de WhatsApp (no más de 50 mensajes por minuto)
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('excel')">📁 Desde Excel</button>
                <button class="tab-btn" onclick="switchTab('manual')">✏️ Números Manuales</button>
                <button class="tab-btn" onclick="switchTab('resultados')">📊 Resultados</button>
            </div>

            <!-- TAB 1: EXCEL -->
            <div id="excel" class="tab-content active">
                <div class="form-group">
                    <label>📁 Selecciona archivo Excel (xlsx)</label>
                    <div class="file-upload">
                        <input type="file" id="fileExcel" accept=".xlsx,.csv">
                        <label for="fileExcel" class="file-label">
                            Arrastra archivo aquí o haz clic para seleccionar
                        </label>
                    </div>
                </div>

                <div id="excelPreview" style="display: none;">
                    <h3>📋 Vista previa:</h3>
                    <div class="numbers-list" id="excelList"></div>
                </div>

                <div class="form-group">
                    <label>📝 Mensaje a enviar</label>
                    <textarea id="mensajeExcel" placeholder="Escribe aquí el mensaje..."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="enviarDesdeExcel()">
                        🚀 Enviar a todos
                    </button>
                    <button class="btn btn-secondary" onclick="limpiarExcel()">
                        🗑️ Limpiar
                    </button>
                </div>
            </div>

            <!-- TAB 2: MANUAL -->
            <div id="manual" class="tab-content">
                <div class="form-group">
                    <label>📱 Números (uno por línea)</label>
                    <textarea id="numerosManual" placeholder="57300123456&#10;57300654321&#10;..."></textarea>
                </div>

                <div class="form-group">
                    <label>📝 Mensaje a enviar</label>
                    <textarea id="mensajeManual" placeholder="Escribe aquí el mensaje..."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="enviarManual()">
                        🚀 Enviar
                    </button>
                    <button class="btn btn-secondary" onclick="limpiarManual()">
                        🗑️ Limpiar
                    </button>
                </div>
            </div>

            <!-- TAB 3: RESULTADOS -->
            <div id="resultados" class="tab-content">
                <h3>📊 Estadísticas</h3>
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalEnviados">0</h3>
                        <p>✅ Enviados</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="totalErrores">0</h3>
                        <p>❌ Errores</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="totalProcesados">0</h3>
                        <p>📊 Total Procesados</p>
                    </div>
                </div>

                <h3 style="margin-top: 30px;">📋 Historial</h3>
                <div class="numbers-list" id="historialEnvios"></div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="progress" id="progressBar">
                <div class="progress-bar" id="progressFill">0%</div>
            </div>

            <!-- LOADING -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #667eea;">Enviando mensajes...</p>
            </div>
        </div>
    </div>

    <script>
        let archivoCargado = [];
        let resultados = {
            enviados: 0,
            errores: 0,
            historial: []
        };

        function switchTab(tab) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });

            // Mostrar tab seleccionado
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // OPCIÓN 1: EXCEL
        document.getElementById('fileExcel')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                // Aquí necesitarías una librería para leer Excel
                // Por ahora, mostrar mensaje
                alert('⚠️ Para leer Excel desde el navegador, usa un servidor backend.\nAlternativamente: copia los números y úsalos en "Números Manuales"');
            };
            reader.readAsArrayBuffer(file);
        });

        async function enviarDesdeExcel() {
            const mensaje = document.getElementById('mensajeExcel').value.trim();
            if (!mensaje) {
                showAlert('El mensaje no puede estar vacío', 'error');
                return;
            }

            if (archivoCargado.length === 0) {
                showAlert('Primero carga un archivo Excel', 'error');
                return;
            }

            await enviarMensajes(archivoCargado, mensaje);
        }

        function limpiarExcel() {
            document.getElementById('fileExcel').value = '';
            document.getElementById('mensajeExcel').value = '';
            document.getElementById('excelPreview').style.display = 'none';
            archivoCargado = [];
        }

        // OPCIÓN 2: MANUAL
        async function enviarManual() {
            const numerosTexto = document.getElementById('numerosManual').value.trim();
            const mensaje = document.getElementById('mensajeManual').value.trim();

            if (!numerosTexto || !mensaje) {
                showAlert('Completa los campos de números y mensaje', 'error');
                return;
            }

            const numeros = numerosTexto.split('\n')
                .map(n => n.trim().replace(/[^\d]/g, ''))
                .filter(n => n.length > 5);

            if (numeros.length === 0) {
                showAlert('No se encontraron números válidos', 'error');
                return;
            }

            await enviarMensajes(numeros, mensaje);
        }

        function limpiarManual() {
            document.getElementById('numerosManual').value = '';
            document.getElementById('mensajeManual').value = '';
        }

        // FUNCIONES AUXILIARES
        async function enviarMensajes(numeros, mensaje) {
            document.getElementById('loading').classList.add('show');
            document.getElementById('progressBar').classList.add('show');

            const claveAdmin = prompt('🔐 Ingresa la clave de administrador:');
            if (!claveAdmin) return;

            let enviados = 0;
            let errores = 0;

            for (let i = 0; i < numeros.length; i++) {
                const numero = numeros[i];

                try {
                    const response = await fetch('http://localhost:3000/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: numero,
                            message: mensaje
                        })
                    });

                    if (response.ok) {
                        enviados++;
                        resultados.historial.push({ numero, status: '✅ Enviado' });
                    } else {
                        errores++;
                        resultados.historial.push({ numero, status: '❌ Error' });
                    }
                } catch (error) {
                    errores++;
                    resultados.historial.push({ numero, status: '❌ Error' });
                }

                // Actualizar progreso
                const progreso = ((i + 1) / numeros.length) * 100;
                document.getElementById('progressFill').style.width = progreso + '%';
                document.getElementById('progressFill').textContent = Math.round(progreso) + '%';

                // Esperar 1 segundo entre mensajes
                await new Promise(r => setTimeout(r, 1000));
            }

            document.getElementById('loading').classList.remove('show');
            document.getElementById('progressBar').classList.remove('show');

            resultados.enviados += enviados;
            resultados.errores += errores;

            actualizarResultados();
            showAlert(`✅ Enviados: ${enviados} | ❌ Errores: ${errores}`, 'success');
        }

        function actualizarResultados() {
            document.getElementById('totalEnviados').textContent = resultados.enviados;
            document.getElementById('totalErrores').textContent = resultados.errores;
            document.getElementById('totalProcesados').textContent = resultados.enviados + resultados.errores;

            const historialHTML = resultados.historial.slice(-20).reverse()
                .map(h => `<div class="number-item"><span>${h.numero}</span><span>${h.status}</span></div>`)
                .join('');

            document.getElementById('historialEnvios').innerHTML = historialHTML || '<p style="text-align: center; color: #999;">Sin registros</p>';
        }

        function showAlert(message, type) {
            const alert = document.querySelector('.alert');
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
